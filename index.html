<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f2a">
  <title>Dashboard for Survey Progress</title>
  <meta name="description" content="Dashboard for survey progress across six cities.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1f2a'/%3E%3Cpath d='M12 26c8-8 16 8 24 0s12 0 16 4' fill='none' stroke='%237cc7c0' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M12 38c8-8 16 8 24 0s12 0 16 4' fill='none' stroke='%23e8b878' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H6M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1116 0z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-satellite" viewBox="0 0 24 24"><path d="M4 20l6-6M14 4l6 6M9 9l6 6"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M3 9l6-6M15 21l6-6"/></symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Dashboard for Survey Progress home">
      <span class="brand-logos">
        <img class="logo-cds" src="assets/logos/cds.png" alt="Construction &amp; Design Services">
        <span class="logo-divider" aria-hidden="true"></span>
        <img class="logo-primove" src="assets/logos/primove.png" alt="PriMove">
      </span>
      <span class="brand-copy"><strong>IUSWDMP</strong><small>Survey Progress</small></span>
    </a>
    <div class="topbar-right">
      <span class="topbar-chip"><i class="live-dot"></i><span class="chip-label">Latest WPR · </span><span id="topbar-report">16–22 Oct 2026</span></span>
    </div>
  </header>

  <main id="main">
    <section class="landing" id="landing">
      <section class="simple-hero">
        <div class="simple-hero-inner">
          <p class="project-line">Survey, Collection of Data, Preparation of Integrated Urban Storm Water Drainage Master Plan (IUSWDMP)</p>
          <h1>Dashboard for Survey Progress</h1>
        </div>
      </section>

      <section class="city-strip-section">
        <div class="city-strip" id="city-grid"></div>
      </section>

      <section class="coverage-section">
        <div class="coverage-map-wrap" data-reveal>
          <div id="coverage-map" class="coverage-map" role="application" aria-label="Map of the six cities"></div>
        </div>
      </section>

    </section>

    <section class="city-view" id="city-view" hidden>
      <div class="city-head">
        <div class="city-head-main">
          <a class="back-link" href="#/"><svg class="icon"><use href="#i-arrow-left"></use></svg> All cities</a>
          <div class="city-title-row">
            <h1 id="city-title">City</h1>
          </div>
          <p class="city-sub" id="city-sub"></p>
        </div>
        <div class="city-head-tools">
          <label class="select-label" for="city-select">Switch city</label>
          <select id="city-select" class="city-select"></select>
        </div>
      </div>

      <div class="map-shell" id="map-shell">
        <div id="map" class="map" role="application" aria-label="Survey map"></div>

        <div class="map-empty" id="map-empty" hidden></div>

        <aside class="panel panel-left" id="layers-panel" aria-label="Map layers">
          <div class="panel-head">
            <div>
              <h2>Map layers</h2>
            </div>
            <div class="panel-head-actions">
              <button class="icon-btn" id="fit-map" type="button" aria-label="Fit map to city" title="Fit to city"><svg class="icon"><use href="#i-fit"></use></svg></button>
              <button class="icon-btn panel-close" type="button" data-close-panel="layers" aria-label="Close layers panel"><svg class="icon"><use href="#i-close"></use></svg></button>
            </div>
          </div>
          <div class="panel-body" id="layers-body"></div>
          <div class="panel-foot" id="layers-foot"></div>
        </aside>

        <aside class="panel panel-right" id="progress-panel" aria-label="Survey progress">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Survey progress</p>
              <h2 id="progress-title">City</h2>
            </div>
            <div class="panel-head-actions">
              <button class="icon-btn panel-close" type="button" data-close-panel="progress" aria-label="Close progress panel"><svg class="icon"><use href="#i-close"></use></svg></button>
            </div>
          </div>
          <div class="panel-body" id="progress-body"></div>
        </aside>

        <div class="map-controls" id="map-controls" aria-label="Map controls">
          <button type="button" data-map-action="in" aria-label="Zoom in"><svg class="icon"><use href="#i-plus"></use></svg></button>
          <button type="button" data-map-action="out" aria-label="Zoom out"><svg class="icon"><use href="#i-minus"></use></svg></button>
          <button type="button" data-map-action="fit" aria-label="Fit map to city"><svg class="icon"><use href="#i-fit"></use></svg></button>
        </div>

        <div class="mobile-actions">
          <button type="button" class="mobile-btn" id="open-layers"><svg class="icon"><use href="#i-layers"></use></svg> Layers</button>
          <button type="button" class="mobile-btn" id="open-progress"><svg class="icon"><use href="#i-chart"></use></svg> Progress</button>
        </div>
        <div class="mobile-backdrop" id="mobile-backdrop"></div>
      </div>
    </section>
  </main>

  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script src="data/cities.js"></script>
  <script src="data/layers/firozabad.js"></script>
  <script src="data/layers/saharanpur.js"></script>
  <script src="data/layers/moradabad.js"></script>
  <script src="data/layers/meerut.js"></script>
  <script src="data/layers/ghaziabad.js"></script>
  <script src="data/layers/shahjahanpur.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
